[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "merlin"
version = "0.0.1"
description = "Simulation-based inference for Euclid 3x2pt cosmology using swyft"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "numpy",
    "torch",
    "scipy<1.14",  # swyft 0.4.5 imports scipy.integrate.simps (removed in 1.14)
    "joblib",
    "psutil",
    "matplotlib",
    "zarr<3",  # swyft.ZarrStore uses zarr.ProcessSynchronizer (removed in 3.0)
    "swyft>=0.4.5",
    "pytorch-lightning",
    "setuptools<81",  # pytorch-lightning 1.x (required by swyft) imports pkg_resources
    "euclidlib",
    "cloelib",
    "getdist",
    "pandas",
]

[project.scripts]
merlin-simulate = "merlin.cli.simulate:main"
merlin-train    = "merlin.cli.train:main"
merlin-plot     = "merlin.cli.plot:main"

[tool.hatch.build.targets.wheel]
packages = ["merlin"]
