[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "merlin"
version = "0.1.0"
description = "Simulation-based inference for Euclid 3x2pt cosmology using swyft"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "numpy",
    "torch",
    "scipy",
    "joblib",
    "psutil",
    "matplotlib",
    "zarr",
    "swyft>=0.4.5",
    "pytorch-lightning",
    "euclidlib",
    "cloelib",
    "getdist",
    "pandas",
]

[project.scripts]
merlin-simulate = "merlin.cli.simulate:main"
merlin-train    = "merlin.cli.train:main"
merlin-plot     = "merlin.cli.plot:main"

[tool.hatch.build.targets.wheel]
packages = ["merlin"]
