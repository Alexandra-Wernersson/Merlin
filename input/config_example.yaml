PRIORS:
  # One entry per name in FIDUCIAL / params.PARAMS (validated by
  # priors.resolve_priors — every name must appear exactly once, in both
  # sections, matched by name not position):
  #   {type: fixed}                        -> held at its FIDUCIAL value,
  #                                           never sampled, not selectable via
  #                                           TRAINING.params_to_infer.
  #   {type: uniform, lower: a, upper: b}   -> Uniform(a, b)
  #   {type: normal,  mean: mu, sigma: s}   -> Normal(mu, s)
  # If true, runs a Fisher analysis and overwrites every "uniform" entry's
  # bounds with fiducial +/- sigma_scale*sigma_Fisher ("normal" entries keep
  # their configured mean/sigma unchanged).
  use_Fisher_priors: true
  sigma_scale: 7
  # covmat_Fisher/nz_Fisher are used ONLY for the Fisher matrix computation --
  # distinct from CLOELIB_SETTINGS.covmat / CLOELIB_SETTINGS.nz used for simulation/observation.
  covmat_Fisher: aux_files/covariance_Gauss_13245_2D_format_probe_zpair_scale.npz
  nz_Fisher: aux_files/nzTabSPV3_euclidlib_format.fits
  # finv_file is auto-derived from RUN.run_dir; do not set by hand.

  params:
    H0:             {type: uniform, lower: 50.0,  upper: 90.0}
    Omega_b0:       {type: uniform, lower: 0.01,  upper: 0.09}
    Omega_cdm0:     {type: uniform, lower: 0.10,  upper: 0.50}
    ns:             {type: uniform, lower: 0.85,  upper: 1.05}
    "ln10^{10}A_s": {type: uniform, lower: 2.50,  upper: 3.60}
    w0:             {type: fixed}
    wa:             {type: fixed}
    Omega_k0:       {type: fixed}
    mnu:            {type: fixed}
    gamma_MG:       {type: fixed}
    log10TAGN:      {type: fixed}
    A_IA:           {type: uniform, lower: -5.0,  upper: 5.0}
    eta_IA:         {type: uniform, lower: -5.0,  upper: 5.0}
    b_g1:           {type: uniform, lower: -3.0,  upper: 4.0}
    b_g2:           {type: uniform, lower: -3.0,  upper: 4.0}
    b_g3:           {type: uniform, lower: -3.0,  upper: 4.0}
    b_g4:           {type: uniform, lower: -3.0,  upper: 4.0}
    b_mag1:         {type: uniform, lower: -3.0,  upper: 3.0}
    b_mag2:         {type: uniform, lower: -3.0,  upper: 3.0}
    b_mag3:         {type: uniform, lower: -3.0,  upper: 3.0}
    b_mag4:         {type: uniform, lower: -3.0,  upper: 3.0}
    b_mag5:         {type: uniform, lower: -3.0,  upper: 3.0}
    b_mag6:         {type: uniform, lower: -3.0,  upper: 3.0}
    b_mag7:         {type: uniform, lower: -3.0,  upper: 3.0}
    b_mag8:         {type: uniform, lower: -3.0,  upper: 3.0}
    b_mag9:         {type: uniform, lower: -3.0,  upper: 3.0}
    b_mag10:        {type: uniform, lower: -3.0,  upper: 3.0}
    b_mag11:        {type: uniform, lower: -3.0,  upper: 3.0}
    b_mag12:        {type: uniform, lower: -3.0,  upper: 3.0}
    b_mag13:        {type: uniform, lower: -3.0,  upper: 3.0}
    m_1:            {type: normal, mean: 0.0, sigma: 0.01}
    m_2:            {type: normal, mean: 0.0, sigma: 0.01}
    m_3:            {type: normal, mean: 0.0, sigma: 0.01}
    m_4:            {type: normal, mean: 0.0, sigma: 0.01}
    m_5:            {type: normal, mean: 0.0, sigma: 0.01}
    m_6:            {type: normal, mean: 0.0, sigma: 0.01}
    m_7:            {type: normal, mean: 0.0, sigma: 0.01}
    m_8:            {type: normal, mean: 0.0, sigma: 0.01}
    m_9:            {type: normal, mean: 0.0, sigma: 0.01}
    m_10:           {type: normal, mean: 0.0, sigma: 0.01}
    m_11:           {type: normal, mean: 0.0, sigma: 0.01}
    m_12:           {type: normal, mean: 0.0, sigma: 0.01}
    m_13:           {type: normal, mean: 0.0, sigma: 0.01}
    # D_i sigma = 0.002*(1+zmean_i), where per-bin mean redshift z_mean is given by 
    # zmean: [0.2894, 0.3763, 0.4374, 0.5363, 0.6186, 0.7093, 0.802, 0.8591, 0.976, 1.093, 1.246, 1.489, 1.922]
    D_1:            {type: normal, mean: 0.0, sigma: 0.0025788}  # 0.002*(1+0.2894)
    D_2:            {type: normal, mean: 0.0, sigma: 0.0027526}  # 0.002*(1+0.3763)
    D_3:            {type: normal, mean: 0.0, sigma: 0.0028748}  # 0.002*(1+0.4374)
    D_4:            {type: normal, mean: 0.0, sigma: 0.0030726}  # 0.002*(1+0.5363)
    D_5:            {type: normal, mean: 0.0, sigma: 0.0032372}  # 0.002*(1+0.6186)
    D_6:            {type: normal, mean: 0.0, sigma: 0.0034186}  # 0.002*(1+0.7093)
    D_7:            {type: normal, mean: 0.0, sigma: 0.003604}   # 0.002*(1+0.802)
    D_8:            {type: normal, mean: 0.0, sigma: 0.0037182}  # 0.002*(1+0.8591)
    D_9:            {type: normal, mean: 0.0, sigma: 0.003952}   # 0.002*(1+0.976)
    D_10:           {type: normal, mean: 0.0, sigma: 0.004186}   # 0.002*(1+1.093)
    D_11:           {type: normal, mean: 0.0, sigma: 0.004492}   # 0.002*(1+1.246)
    D_12:           {type: normal, mean: 0.0, sigma: 0.004978}   # 0.002*(1+1.489)
    D_13:           {type: normal, mean: 0.0, sigma: 0.005844}   # 0.002*(1+1.922)
    # width_pos_i/width_shear_i: dndz stretch systematics, fixed at 1.0 (no stretch)
    width_pos_1:    {type: fixed}
    width_pos_2:    {type: fixed}
    width_pos_3:    {type: fixed}
    width_pos_4:    {type: fixed}
    width_pos_5:    {type: fixed}
    width_pos_6:    {type: fixed}
    width_pos_7:    {type: fixed}
    width_pos_8:    {type: fixed}
