MOCK_OBS:
  # true  -> simulate C_ells and noise separately from the fiducial cosmology
  #          (path ignored, can be left null) 
  # false -> load an already-noisy data vector (C_ells + noise combined — e.g.
  #          real data) from the .npy array at `path`. 
  generate_from_fiducial: true
  path: null
  # Only used when generate_from_fiducial is true.
  # false -> the fiducial observation used for inference has zero noise  
  # true  -> adds a random noise realization to the fiducial observation.
  add_noise_fid_obs: false

CLOELIB_SETTINGS:
  # covmat/nz used for simulation, observation generation, and preprocessing —
  # everything except the Fisher matrix computation itself (see
  # PRIORS.covmat_Fisher / PRIORS.nz_Fisher).
  covmat: aux_files/covariance_Gauss_13245_2D_format_probe_zpair_scale.npz
  nz: aux_files/nzTabSPV3_euclidlib_format.fits
  Nbin_z: 13
  # Accepts either a file path (string) or an inline list, as below.
  ell: [
    10.97557970, 13.11709027, 15.67644367, 18.73516773, 22.39069761,
    26.75947964, 31.98068069, 38.22062129, 45.67807378, 54.59059412,
    65.24208925, 77.97186088, 93.18541388, 111.36737359, 133.09692347,
    159.06625492, 190.10261691, 227.19466787, 271.52396925, 324.50262398,
    387.81825878, 463.48778323, 553.92163814, 662.00057974, 791.16744571,
    945.53682628, 1130.02613377, 1350.51224608, 1614.01871364, 1928.93949355,
    2305.30633773, 2755.10835283
  ]
  # Optional: compute/store derived quantities, selectable in
  # TRAINING.params_to_infer. null (default) or any of/list of sigma8, Omega_m, S8.
  add_derived: null


SIMULATION:
  # Settings for merlin-simulate's parallel store-filling loop.
  N_sims: 100000
  batch_size: 64
  chunk_size: 64
  n_workers: 72
  # false -> normal behaviour (create the store if missing, resume filling it up to N_sims otherwise).
  # true  -> grow the EXISTING store at this run's store_path to the new,larger N_sims 
  add_extra_sims: false


ANALYSIS_VARIANTS:
  # Modifications applied to the data AFTER the simulation store has been generated 
  # Different train_<N> runs against the same store can use different ANALYSIS_VARIANTS settings.
  SCALE CUTS:
    SHE_SHE: 1500   # ell_max for WL spectra
    POS_SHE: 750    # ell_max for GGL cross-spectra
    POS_POS: 750    # ell_max for GCph spectra
  # false -> use the store's original noise samples as-is.
  # true  -> discard them and draw N_sims fresh noise realizations from the
  #          current CLOELIB_SETTINGS.covmat (Lfid) instead.
  regenerate_noise_samples: false
  # Which probes to train on, applied after SCALE CUTS:
  #   3x2pt -> WL + GGL + GCph
  #   2x2pt -> GGL + GCph
  #   WL    -> WL only 
  train_on_data: 3x2pt


PCA:
  # false -> reuse a cached basis: PCA.SVD if already present, or copied in
  # from another train_<N>'s SVD.npy if pca_file is set.
  recompute_pca: true
  # Only used when recompute_pca is false: another train_<N>'s SVD.npy to
  # reuse; leave unset to load this train_<N>'s own (must already exist).
  # pca_file: /path/to/output/run_name/train_<N>/aux_files/SVD.npy
  q: 500          # max number of components kept
  variance_cut: 0.001   # min percent variance a component must explain to be kept


NETWORK:
  # Architecture settings — hidden_feat_compress/num_feat_param control the
  # compression MLP; num_blocks_ratios/hidden_feat_ratios/dropout_ratios
  # configure swyft's own ratio-estimator network.
  hidden_feat_compress: [2048, 512]   # compression-MLP hidden-layer sizes
  num_feat_param: 1     # compressed features kept per inferred parameter
  num_blocks_ratios: 4
  hidden_feat_ratios: 64
  dropout_ratios: 0.1


TRAINING:
  learning_rate: 5.0e-4
  batch_size: 256
  num_workers: 3       # DataLoader worker processes
  max_epochs: -1       # -1 = unlimited, rely on early_stopping
  early_stopping: 5    # patience, in epochs, on val_loss
  val_fraction: 0.2
  accelerator: auto   # auto-detect GPU/CPU
  # Train on only the first frac*N_sims simulations in the store, useful for testing.
  train_on_frac: 1.0
  # Which parameters the network is trained to produce posteriors/ratios for —
  # group name from PARAM_GROUPS or an explicit list e.g. [H0, A_IA, eta_IA].
  # Must be a subset of the parameters varied in PRIORS
  params_to_infer: COSMO


PLOTTING:
  # Optional: overlay a nested-sampling chain on corner plots via getdist.
  # null = no overlay. Expects a .npz with a 0-d object array "chain" (a dict
  # of {param_name: samples}, keyed by the underlying physics names — see
  # params.MCMC_KEY_MAP) and "weights" holding LOG nested-sampling weights.
  mcmc_path: null
  # swyft.plot_corner/get_pdf smoothing and bin count for Merlin's density
  # estimate in corner plots (--smooth/--bins on merlin-plot override these).
  smooth_swyft: 1.0
  nbins_swyft: 100
